name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Version"
        required: true
        default: "v"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: "Set version number from trigger's tag"
        id: update_manifest
        run: |
          yq -i -o json '.version="${{ github.event.inputs.tag}}"' \
            "${{ github.workspace }}/package.json"
          git config --global user.email "moranderic31@gmail.com"
          git config --global user.name "Elwinmage"
          git commit -a -m "Update version"
          git push origin HEAD:main
          SHA=`git rev-parse HEAD`
          echo "tag_sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Create tag
        if: steps.update_manifest.outcome == 'success'
        uses: actions/github-script@v9
        id: create_tag
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ github.event.inputs.tag}}',
              sha: '${{steps.update_manifest.outputs.tag_sha}}'
            })

      - name: Check bundle
        run: |
          # HACS only supports zip_release for integrations. For a dashboard
          # card it downloads the asset named after hacs.json "filename" as-is
          # (and gzips it itself), so the asset MUST be the plain JS bundle.
          f="dist/ha-reef-card.js"
          test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
          # Refuse to ship an archive disguised as JS (zip 'PK', gzip 1f8b).
          magic=$(head -c 2 "$f" | od -An -tx1 | tr -d ' \n')
          case "$magic" in
            504b|1f8b) echo "::error::$f is an archive, not JavaScript"; exit 1 ;;
          esac
          ls -la dist/

      - name: Create Release with Assets
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          tag: ${{ github.event.inputs.tag }}
          # Plain JS bundle, uploaded under the name HACS looks for.
          artifacts: "dist/ha-reef-card.js"
          allowUpdates: true
          # Overwrite a previously uploaded (zipped) asset with the same name.
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
