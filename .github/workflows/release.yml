name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag Version"
        required: true
        default: "v"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: "Set version number from trigger's tag"
        id: update_manifest
        run: |
          yq -i -o json '.version="${{ github.event.inputs.tag}}"' \
            "${{ github.workspace }}/package.json"
          git config --global user.email "moranderic31@gmail.com"
          git config --global user.name "Elwinmage"
          git commit -a -m "Update version"
          git push origin HEAD:main
          SHA=`git rev-parse HEAD`
          echo "tag_sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Create tag
        if: steps.update_manifest.outcome == 'success'
        uses: actions/github-script@v9
        id: create_tag
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ github.event.inputs.tag}}',
              sha: '${{steps.update_manifest.outputs.tag_sha}}'
            })

      - name: Build HACS zip release
        run: |
          # HACS unzips the release asset named after hacs.json "filename"
          # straight into www/community/ha-reef-card/, so the archive must
          # contain the *content* of dist/, not the dist/ folder itself.
          #
          # Also regenerate the .gz: HACS only creates it when it writes a .js
          # file individually, never when extracting an archive. Without it,
          # a stale .gz would keep being served by the /hacsfiles endpoint.
          gzip -9 -k -f dist/ha-reef-card.js
          cd dist && zip -r "${GITHUB_WORKSPACE}/ha-reef-card.js" .
          unzip -l "${GITHUB_WORKSPACE}/ha-reef-card.js"

      - name: Create Release with Assets
        uses: ncipollo/release-action@v1
        with:
          prerelease: true # Passe à false si tu veux des versions stables
          tag: ${{ github.event.inputs.tag }}
          # 🎯 C'EST CETTE LIGNE QUI FAIT LA DIFFÉRENCE :
          artifacts: "ha-reef-card.js" # Indique le chemin de ton fichier compiled/JS
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
