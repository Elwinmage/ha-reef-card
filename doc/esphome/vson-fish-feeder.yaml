# Define the switch for controlling the motor
switch:
  - platform: gpio
    pin:
      number: GPIO5
    id: motor_switch
    name: "Manual Feed"
    restore_mode: ALWAYS_OFF
    icon: mdi:pinwheel

  - platform: restart
    name: "System - Restart"
    id: restart_switch

  - platform: safe_mode
    name: "System - Safe mode"
