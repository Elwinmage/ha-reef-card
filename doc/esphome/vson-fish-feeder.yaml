# Define binary sensors
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pulldown: true
    name: "Open/Close Sensor"
    id: open_close_sensor
    device_class: door
    filters:
      - delayed_on_off: 2s
    on_state_change:
      then:
        - if:
            condition:
              binary_sensor.is_off: open_close_sensor
            then:
              - switch.turn_off: motor_switch
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: False
    name: "Food Level Sensor"
    id: food_level_sensor
    device_class: problem
    icon: "mdi:alert"

###########################
# NUMBER
number:
  # SLOT 1
  - platform: template
    id: food_portion_slot_1
    name: "Portion slot 1"
    icon: "mdi:shaker"
    step: 1
    max_value: 10
    min_value: 0
    # Optimistic: the new value is published as soon as it is set. With a
    # lambda instead, Home Assistant only got it at the next poll of the
    # template (every 60 s by default), which made the card look stuck.
    optimistic: true
    set_action:
      then:
        - logger.log:
            format: "Number of portion set"
        - lambda: |-
            id(g_food_portion_slot_1) = x;
