esphome:
  name: "fish-feeder"
  friendly_name: "Fish Feeder"
  # Lets ha-reef-card recognise the feeder: Home Assistant turns the project
  # name into the manufacturer ("vson") and the model ("fish_feeder").
  project:
    name: "vson.fish_feeder"
    version: "1.2.0"
  on_boot:
    priority: -10
    then:
      - delay: 2s
      - if:
          condition:
            binary_sensor.is_on: open_close_sensor
          then:
            - switch.turn_on: motor_switch
      - logger.log:
          format: "Hello Fish Feeder"
      - logger.log:
          format: "Restoring feeding slots: %d [%d]"
          args: ["id(g_feed_time_slot_1)", "id(g_food_portion_slot_1)"]
      # SLOT 1
      - datetime.time.set:
          id: feed_slot_1
          time: !lambda |-
            return {.second = 0, .minute = uint8_t(id(g_feed_time_slot_1)%60), .hour = uint8_t(id(g_feed_time_slot_1)/60)};
      - number.set:
          id: food_portion_slot_1
          value: !lambda |-
            return int(id(g_food_portion_slot_1));
      # SLOT 2
      - datetime.time.set:
          id: feed_slot_2
          time: !lambda |-
            return {.second = 0, .minute = uint8_t(id(g_feed_time_slot_2)%60), .hour = uint8_t(id(g_feed_time_slot_2)/60)};
      - number.set:
          id: food_portion_slot_2
          value: !lambda |-
            return int(id(g_food_portion_slot_2));
      # SLOT 3
      - datetime.time.set:
          id: feed_slot_3
          time: !lambda |-
            return {.second = 0, .minute = uint8_t(id(g_feed_time_slot_3)%60), .hour = uint8_t(id(g_feed_time_slot_3)/60)};
      - number.set:
          id: food_portion_slot_3
          value: !lambda |-
            return int(id(g_food_portion_slot_3));
      # SLOT 4
      - datetime.time.set:
          id: feed_slot_4
          time: !lambda |-
            return {.second = 0, .minute = uint8_t(id(g_feed_time_slot_4)%60), .hour = uint8_t(id(g_feed_time_slot_4)/60)};
      - number.set:
          id: food_portion_slot_4
          value: !lambda |-
            return int(id(g_food_portion_slot_4));
      # SLOT 5
      - datetime.time.set:
          id: feed_slot_5
          time: !lambda |-
            return {.second = 0, .minute = uint8_t(id(g_feed_time_slot_5)%60), .hour = uint8_t(id(g_feed_time_slot_5)/60)};
      - number.set:
          id: food_portion_slot_5
          value: !lambda |-
            return int(id(g_food_portion_slot_5));

globals:
  # Portion counter
  - id: g_portion_count
    type: int
    restore_value: False
    initial_value: "0"
  # Portion counter
  - id: g_feeding_in_progress
    type: int
    restore_value: False
    initial_value: "0"
  # SLOT 1
  - id: g_feed_time_slot_1
    type: int
    restore_value: true
    initial_value: "0"
  - id: g_food_portion_slot_1
    type: int
    restore_value: true
    initial_value: "0"
  # SLOT 2
  - id: g_feed_time_slot_2
    type: int
    restore_value: true
    initial_value: "0"
  - id: g_food_portion_slot_2
    type: int
    restore_value: true
    initial_value: "0"
  # SLOT 3
  - id: g_feed_time_slot_3
    type: int
    restore_value: true
    initial_value: "0"
  - id: g_food_portion_slot_3
    type: int
    restore_value: true
    initial_value: "0"
  # SLOT 4
  - id: g_feed_time_slot_4
    type: int
    restore_value: true
    initial_value: "0"
  - id: g_food_portion_slot_4
    type: int
    restore_value: true
    initial_value: "0"
  # SLOT 5
  - id: g_feed_time_slot_5
    type: int
    restore_value: true
    initial_value: "0"
  - id: g_food_portion_slot_5
    type: int
    restore_value: true
    initial_value: "0"

# Enable Home Assistant API
api:
  encryption:
    key: !secret fish_feeder_api_key

ota:
  - platform: esphome
    password: !secret fish_feeder_ota_password

esp32:
  board: lolin_s2_mini #Pinout: https://www.wemos.cc/en/latest/s2/s2_mini.html
  framework:
    type: esp-idf
    version: recommended

preferences:
  flash_write_interval: 0s

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.0.120 # adapt to your network
    gateway: 192.168.0.1
    subnet: 255.255.255.0
  ap:
    ssid: "Fish Feeder Fallback Hotspot"
    password: !secret fish_feeder_ap_password

time:
  - platform: homeassistant
    id: homeassistant_time

  - platform: sntp
    id: sntp_time
    timezone: "Europe/Paris"
    servers:
      - pool.ntp.org
      - time.cloudflare.com
    on_time:
      - seconds: 0
        minutes: 0
        hours: 1
        days_of_week: 1-7
        then:
          - switch.toggle: restart_switch

captive_portal:

# Template sensor to display the Open/Close Counter value
sensor:
  - platform: uptime
    name: "System - Uptime"

datetime:
  # SLOT 1
  - platform: template
    time_id: homeassistant_time
    name: "Slot 1"
    id: feed_slot_1
    type: TIME
    optimistic: True
    restore_value: true
    set_action:
      then:
        - logger.log:
            format: "Set time for slot 1:"
    on_time:
      - if:
          condition:
            - lambda: "return id(food_portion_slot_1).state > 0;"
            - lambda: "return id(g_feeding_in_progress) == 0;"
          then:
            - lambda: "id(g_feeding_in_progress) = 1;"
            - lambda: "id(g_portion_count)=id(g_food_portion_slot_1);"
            - while:
                condition:
                  - lambda: "return id(g_portion_count) > 0;"
                then:
                  - lambda: "id(g_portion_count) -= 1;"
                  - logger.log:
                      format: "Portions slot 1 to give: %d"
                      args: ["id(g_portion_count)"]
                  - switch.turn_on: motor_switch
                  - delay: 30s
            - lambda: "id(g_feeding_in_progress) = 0;"

    on_value:
      then:
        - logger.log:
            format: "Set time.on_value for slot 1"
        - lambda: |-
            id(g_feed_time_slot_1) = x.hour*60+x.minute;
