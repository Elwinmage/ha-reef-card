repos:
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npx prettier --write
        types_or: [ts, javascript, json, css, markdown, yaml]
        exclude: ^dist/
        language: system

  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        language: system
        entry: npx eslint
        args: [--fix, --no-warn-ignored]
        files: \.(ts|js)$
        exclude: ^(dist/|tests/|vite\.config|vitest\.config)
        types: [file]

      - id: check_translation
        name: Check Entities translations
        entry: python scripts/check_translations.py
        language: python
        pass_filenames: false

      - id: supplements_list
        name: Check supplements list
        entry: python scripts/update_supplements_list.py
        language: python
        pass_filenames: false

      - id: supplements_image
        name: Update Supplements Images List in README
        entry: python scripts/supplement_img.py
        language: python
        pass_filenames: false

      - id: coverage
        name: Tests coverage
        language: system
        entry: npm run test:coverage
        pass_filenames: false
